<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Redline Typist – 3D Typing Racer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--ink:#f6eefc;--grey:#8d8aa6;--ok:#6dffb8;--hot:#ff4d6d;--amber:#ffb454;--cyan:#38e8ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#150b2e;color:var(--ink);font-family:'Chakra Petch',system-ui,sans-serif;overflow:hidden;color-scheme:dark}
.glass{background:rgba(18,10,42,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.16);border-radius:16px;box-shadow:0 8px 40px rgba(0,0,0,.35),inset 0 0 30px rgba(56,232,255,.06)}
#hud{position:fixed;inset:0;pointer-events:none}
#top{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;gap:12px}
#gauge{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(18,10,42,.75),rgba(18,10,42,.45));border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(10px);box-shadow:0 0 40px rgba(56,232,255,.22)}
#needle{transition:none;filter:drop-shadow(0 0 4px #ffb454)}
#panel{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(680px,calc(100vw - 24px));padding:14px 18px}
#txt{position:relative;height:96px;overflow:hidden;scroll-behavior:smooth;font:500 22px/32px 'JetBrains Mono',ui-monospace,monospace;color:var(--grey);word-break:break-word}
#txt span{transition:color .08s}
#txt .ok{color:var(--ok);text-shadow:0 0 8px rgba(109,255,184,.55)}
#txt .cur{background:rgba(255,180,84,.35);color:#fff;border-radius:3px;box-shadow:0 0 12px rgba(255,180,84,.7)}
#txt .err{background:var(--hot)!important;box-shadow:0 0 18px var(--hot)!important}
#panel.shake{animation:sh .16s}@keyframes sh{25%{transform:translateX(calc(-50% - 5px))}75%{transform:translateX(calc(-50% + 5px))}}
#flash{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 120px rgba(255,60,90,.0);transition:box-shadow .25s}
#flash.on{box-shadow:inset 0 0 140px rgba(255,60,90,.55)}
.badge{position:fixed;left:0;top:0;pointer-events:none;font-weight:700;font-size:13px;padding:3px 9px;border-radius:999px;background:rgba(18,10,42,.7);border:1px solid rgba(255,255,255,.3);white-space:nowrap;will-change:transform}
.ov{position:fixed;inset:0;display:flex;overflow-y:auto;background:radial-gradient(circle at 50% 60%,rgba(60,20,80,.45),rgba(10,5,25,.85));z-index:5;text-align:center;padding:20px}
.btn{background:linear-gradient(135deg,#ff7a45,#ff3d7f);color:#fff;font-weight:700;font-size:18px;padding:12px 34px;border-radius:999px;box-shadow:0 0 30px rgba(255,61,127,.55);cursor:pointer;border:0;font-family:inherit}
.btn:hover{filter:brightness(1.12)}
#panel+x{}.ov>.glass{margin:auto}.sw{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.35);cursor:pointer}.sw.on{border-color:#fff;box-shadow:0 0 12px #fff}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--grey);font:inherit;font-weight:700;padding:6px 18px;cursor:pointer}.tab.on{color:#fff;border-color:var(--amber)}.pn{margin-top:20px;text-align:left}.pn label{display:block;font-size:13px;color:var(--grey);margin:18px 0 8px}.pn label:first-child{margin-top:0}.row{display:flex;gap:8px;flex-wrap:wrap}
#ct{display:none;width:100%;margin-top:10px;height:70px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);border-radius:10px;color:#fff;font:14px 'JetBrains Mono',monospace;padding:8px;resize:none}
#count{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font-size:min(30vw,220px);font-weight:700;text-shadow:0 0 50px var(--amber);pointer-events:none;z-index:4}
.chip,.tchip,.vchip,.snd,.mchip{font:inherit;font-weight:700;padding:6px 18px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);color:#fff;cursor:pointer}.chip.on,.tchip.on,.vchip.on,.snd.on,.mchip.on{background:linear-gradient(135deg,#38e8ff,#7a5cff);border-color:transparent}
#nb{width:90px;height:8px;border-radius:9px;background:rgba(255,255,255,.15);overflow:hidden;display:inline-block}#nbar{display:block;height:100%;width:0;background:linear-gradient(90deg,#38e8ff,#ff3d7f)}#nb.full{box-shadow:0 0 12px #38e8ff}
@media (max-width:1000px){#gauge{bottom:calc(env(safe-area-inset-bottom,0px) + 190px);width:150px;height:150px}}
</style></head><body>
<canvas id="c" style="position:fixed;inset:0;width:100%;height:100%"></canvas>
<div id="flash"></div><div id="badges"></div>
<div id="hud">
 <div id="top">
  <div class="glass px-4 py-2" style="min-width:104px"><div id="pos" class="text-4xl font-bold leading-none">#1</div><div class="text-xs" style="color:var(--grey)">of 4 racers</div></div>
  <div class="glass flex-1 px-4 py-3"><div id="track" class="relative h-2 rounded-full" style="background:rgba(255,255,255,.15);margin:6px 6px 0"><div id="fill" class="h-2 rounded-full" style="width:0;background:linear-gradient(90deg,#38e8ff,#ff3d7f)"></div></div>
   <div class="flex justify-between text-xs mt-3" style="color:var(--grey)"><span id="rem">1800 m to go</span><span id="time">0:00.0</span></div></div>
 </div>
 <div id="gauge"><svg viewBox="0 0 200 200" width="100%" height="100%"><defs><linearGradient id="gg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#38e8ff"/><stop offset="1" stop-color="#ff3d7f"/></linearGradient></defs>
  <path d="M43.43 156.57 A80 80 0 1 1 156.57 156.57" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="8" stroke-linecap="round" pathLength="1"/>
  <path id="arc" d="M43.43 156.57 A80 80 0 1 1 156.57 156.57" fill="none" stroke="url(#gg)" stroke-width="8" stroke-linecap="round" pathLength="1" stroke-dasharray="0 1"/>
  <g id="ticks"></g><g id="needle"><line x1="100" y1="100" x2="168" y2="100" stroke="#ffb454" stroke-width="3" stroke-linecap="round"/></g>
  <circle cx="100" cy="100" r="9" fill="#1b1030" stroke="#ffb454" stroke-width="2"/>
  <text id="kmh" x="100" y="146" text-anchor="middle" fill="#fff" font-size="34" font-weight="700" font-family="Chakra Petch">0</text>
  <text x="100" y="161" text-anchor="middle" fill="#8d8aa6" font-size="10" font-family="Chakra Petch">km/h</text>
  <text id="wpmT" x="100" y="78" text-anchor="middle" fill="#38e8ff" font-size="13" font-weight="700" font-family="Chakra Petch">0 WPM</text></svg></div>
 <div id="panel" class="glass"><div id="txt"></div>
  <div class="flex gap-5 text-sm mt-2" style="color:var(--grey)"><span>Accuracy <b id="acc" style="color:#fff">100%</b></span><span>Errors <b id="errs" style="color:#fff">0</b></span><span class="ml-auto flex items-center gap-2">Nitro <b style="color:#fff">Tab</b><span id="nb"><i id="nbar"></i></span></span></div></div>
</div>
<div id="count"></div><div id="draft" class="glass" style="position:fixed;top:96px;left:50%;transform:translateX(-50%);padding:4px 14px;display:none;color:var(--cyan);font-weight:700">Slipstream +7%</div>
<div id="intro" class="ov"><div class="glass" style="padding:32px 36px;width:min(460px,100%)">
 <h1 class="text-5xl font-bold" style="letter-spacing:-.02em;background:linear-gradient(90deg,#ffb454,#ff3d7f);-webkit-background-clip:text;color:transparent;text-align:center">Redline Typist</h1>
 <p class="mt-2" style="color:#d9cdee;text-align:center">Type fast and clean to drive. Beat three rivals to the finish line.</p>
 <div class="flex justify-center gap-2 mt-6"><button class="tab on" data-p="p1">Race</button><button class="tab" data-p="p2">Car</button><button class="tab" data-p="p3">More</button></div>
 <div id="p1" class="pn"><label>Difficulty</label><div class="row"><button class="chip" data-d="0">Easy</button><button class="chip on" data-d="1">Normal</button><button class="chip" data-d="2">Hard</button></div>
  <label>Scene</label><div class="row"><button class="tchip on" data-t="0">Sunset</button><button class="tchip" data-t="1">Neon Night</button><button class="tchip" data-t="2">Alpine Day</button><button class="tchip" data-t="3">Storm</button></div></div>
 <div id="p2" class="pn" style="display:none"><label>Body</label><div class="row"><button class="vchip on" data-v="coupe" title="Balanced">Coupe</button><button class="vchip" data-v="sedan" title="High top speed, slower launch">Sedan</button><button class="vchip" data-v="hatch" title="Quick launch, lower top speed">Hatch</button><button class="vchip" data-v="truck" title="Highest top speed, slowest launch">Truck</button></div>
  <label>Paint</label><div class="row"><button class="sw on" data-c="1478ff" style="background:#1478ff" aria-label="Paint 1478ff"></button><button class="sw" data-c="ff7a1a" style="background:#ff7a1a" aria-label="Paint ff7a1a"></button><button class="sw" data-c="e0172f" style="background:#e0172f" aria-label="Paint e0172f"></button><button class="sw" data-c="22c55e" style="background:#22c55e" aria-label="Paint 22c55e"></button><button class="sw" data-c="f5f5f7" style="background:#f5f5f7" aria-label="Paint f5f5f7"></button><button class="sw" data-c="ffd21a" style="background:#ffd21a" aria-label="Paint ffd21a"></button><button class="sw" data-c="a855f7" style="background:#a855f7" aria-label="Paint a855f7"></button><button class="sw" data-c="16161a" style="background:#16161a" aria-label="Paint 16161a"></button></div></div>
 <div id="p3" class="pn" style="display:none"><label>Text</label><div class="row"><button class="mchip on" data-m="mix">Mixed</button><button class="mchip" data-m="sent">Sentences</button><button class="mchip" data-m="code">Code</button><button class="mchip" data-m="custom">Custom</button></div><textarea id="ct" placeholder="Paste your own text. Letters, numbers and punctuation work best."></textarea>
  <label>Sound</label><div class="row"><button class="snd on" data-s="on">On</button><button class="snd" data-s="off">Off</button></div></div>
 <p id="best" class="mt-5 text-sm" style="color:var(--amber);text-align:center"></p>
 <button id="go" class="btn mt-3 w-full">Start race</button>
 <p class="text-xs mt-3" style="color:var(--grey);text-align:center">Wrong keys slow you down. Press Tab to use nitro.</p></div></div>
<div id="done" class="ov" style="display:none"><div class="glass" style="padding:28px 34px;width:min(460px,100%);text-align:center">
 <div id="place" class="text-5xl font-bold"></div><div id="dmsg" class="mt-1" style="color:#d9cdee"></div><div id="nr" class="mt-1 font-bold" style="color:var(--amber)"></div>
 <div class="flex justify-center gap-8 mt-5"><div><div id="rw" class="text-3xl font-bold" style="color:var(--cyan)"></div><div class="text-xs" style="color:var(--grey)">avg WPM</div></div><div><div id="ra" class="text-3xl font-bold" style="color:var(--ok)"></div><div class="text-xs" style="color:var(--grey)">accuracy</div></div><div><div id="rt" class="text-3xl font-bold" style="color:var(--amber)"></div><div class="text-xs" style="color:var(--grey)">time</div></div></div>
 <svg id="wc" viewBox="0 0 300 70" width="100%" height="70" class="mt-5"></svg><div id="mk" class="text-sm mt-1" style="color:var(--grey)"></div>
 <div class="flex gap-3 justify-center mt-6"><button id="again" class="btn">Race again</button><button id="setup" class="chip">Change setup</button></div></div></div>
<div id="pause" class="ov" style="display:none"><div class="glass" style="padding:28px 34px;text-align:center;width:min(360px,100%)"><div class="text-3xl font-bold">Paused</div><p class="text-sm mt-2" style="color:var(--grey)">Press Esc to resume.</p><div class="flex flex-col gap-3 mt-5"><button id="resume" class="btn">Resume</button><button id="mute" class="chip">Sound: on</button><button id="quit" class="chip">Quit to setup</button></div></div></div>
<script>
const $=id=>document.getElementById(id),rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const L=1800,LANES=[-6,-2,2,6],TILE=100,NT=7;
const renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.fog=new THREE.Fog(0xc9577c,70,430);
const camera=new THREE.PerspectiveCamera(62,1,.1,1400);
function ctex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t}
function rep(t,x,y){t=t.clone();t.needsUpdate=true;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(x,y);return t}
/* ---------- sky, sun, light ---------- */
const SKY0=[[0,'#150b3a'],[.35,'#4a1f6e'],[.5,'#ee5a6f'],[.56,'#ffb066'],[.6,'#7a3a6a'],[1,'#2a1442']];
function drawSky(g,w,h,st){const q=g.createLinearGradient(0,0,0,h);st.forEach(s=>q.addColorStop(s[0],s[1]));g.fillStyle=q;g.fillRect(0,0,w,h)}
const skyTex=ctex(512,256,(g,w,h)=>drawSky(g,w,h,SKY0));
const pmrem=new THREE.PMREMGenerator(renderer);scene.environment=pmrem.fromEquirectangular(skyTex).texture;
const sky=new THREE.Group();scene.add(sky);
sky.add(new THREE.Mesh(new THREE.SphereGeometry(1000,32,16),new THREE.MeshBasicMaterial({map:skyTex,side:THREE.BackSide,fog:false,depthWrite:false})));
const sunM=new THREE.Mesh(new THREE.CircleGeometry(60,48),new THREE.MeshBasicMaterial({color:0xffd9a0,fog:false,toneMapped:false}));sunM.position.set(0,55,-900);
const glow=new THREE.Mesh(new THREE.CircleGeometry(230,48),new THREE.MeshBasicMaterial({color:0xff7a5a,fog:false,transparent:true,opacity:.35,blending:THREE.AdditiveBlending,depthWrite:false}));glow.position.set(0,55,-905);sky.add(sunM,glow);
const hemi=new THREE.HemisphereLight(0xff9a8a,0x2a1442,.6);scene.add(hemi);
const sunL=new THREE.DirectionalLight(0xffb27a,2.3);sunL.castShadow=true;sunL.shadow.mapSize.set(2048,2048);
Object.assign(sunL.shadow.camera,{left:-28,right:28,top:28,bottom:-28,near:1,far:170});sunL.shadow.bias=-.0004;scene.add(sunL,sunL.target);
/* far skyline */
const skW=ctex(64,128,(g,w,h)=>{g.fillStyle='#22113f';g.fillRect(0,0,w,h);for(let y=4;y<h;y+=10)for(let x=4;x<w;x+=10)if(Math.random()<.35){g.fillStyle=Math.random()<.3?'#8fd8ff':'#ffc47a';g.fillRect(x,y,4,5)}});
const skyline=[];for(let i=0;i<46;i++){const h=rnd(30,170),w=rnd(16,40),m=new THREE.Mesh(new THREE.BoxGeometry(w,h,w),new THREE.MeshBasicMaterial({map:rep(skW,2,h/22),fog:false}));m.userData={z0:rnd(0,700),x:(i%2?1:-1)*rnd(80,340),h};scene.add(m);skyline.push(m)}
/* ---------- road & city tiles ---------- */
const roadMat=new THREE.MeshStandardMaterial({roughness:.72,metalness:.1,envMapIntensity:.6,map:ctex(256,1000,(g,w,h)=>{g.fillStyle='#2b2a33';g.fillRect(0,0,w,h);for(let i=0;i<16000;i++){const v=30+Math.random()*36|0;g.fillStyle=`rgb(${v},${v},${v+6})`;g.fillRect(Math.random()*w,Math.random()*h,1+Math.random()*1.6,1+Math.random()*1.6)}g.fillStyle='#e9e6f0';for(let k=1;k<4;k++)for(let y=0;y<h;y+=100)g.fillRect(k*w/4-2,y,4,30);g.fillStyle='#ffd25a';g.fillRect(3,0,5,h);g.fillRect(w-8,0,5,h)})});
const winTex=ctex(64,128,(g,w,h)=>{g.fillStyle='#000';g.fillRect(0,0,w,h);for(let y=4;y<h;y+=12)for(let x=4;x<w;x+=12)if(Math.random()<.55){g.fillStyle=Math.random()<.2?'#9fe8ff':'#ffd08a';g.fillRect(x,y,6,7)}});
const BL=[30,48,70,95].map(h=>({g:new THREE.BoxGeometry(12,h,12),m:new THREE.MeshStandardMaterial({color:0x1b1432,roughness:.6,metalness:.3,emissive:0xffffff,emissiveMap:rep(winTex,1.6,h/10),emissiveIntensity:.8})}));
const M={g:new THREE.MeshStandardMaterial({color:0x1d1233,roughness:1}),bar:new THREE.MeshStandardMaterial({color:0x3a3450,roughness:.6}),cy:new THREE.MeshBasicMaterial({color:0x38e8ff,toneMapped:false}),mg:new THREE.MeshBasicMaterial({color:0xff3d9a,toneMapped:false}),
 glC:new THREE.MeshBasicMaterial({color:0x38e8ff,transparent:true,opacity:.3,blending:THREE.AdditiveBlending,depthWrite:false}),glM:new THREE.MeshBasicMaterial({color:0xff3d9a,transparent:true,opacity:.3,blending:THREE.AdditiveBlending,depthWrite:false}),
 pole:new THREE.MeshStandardMaterial({color:0x555064,metalness:.7,roughness:.4}),lamp:new THREE.MeshBasicMaterial({color:0xffd9a0,toneMapped:false}),trunk:new THREE.MeshStandardMaterial({color:0x4a2f22,roughness:1}),
 f1:new THREE.MeshStandardMaterial({color:0x2f7d4f,flatShading:true,roughness:.9}),f2:new THREE.MeshStandardMaterial({color:0x3d9a5a,flatShading:true,roughness:.9})};
const G={road:new THREE.PlaneGeometry(16,TILE),gr:new THREE.PlaneGeometry(120,TILE),bar:new THREE.BoxGeometry(.7,.6,TILE),neon:new THREE.BoxGeometry(.14,.08,TILE),gl:new THREE.PlaneGeometry(1.6,TILE),pole:new THREE.CylinderGeometry(.07,.1,7,6),arm:new THREE.BoxGeometry(1.1,.08,.08),lamp:new THREE.BoxGeometry(.9,.1,.35),trunk:new THREE.CylinderGeometry(.18,.25,1.6,6),f1:new THREE.IcosahedronGeometry(1.3,0),f2:new THREE.IcosahedronGeometry(.9,0)};
function mk(geo,mat,x,y,z,rx,sh){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);if(rx)m.rotation.x=rx;if(sh)m.receiveShadow=true;return m}
const tiles=[];
for(let i=0;i<NT;i++){const g=new THREE.Group();g.add(mk(G.road,roadMat,0,0,0,-Math.PI/2,1));
 for(const s of[-1,1]){g.add(mk(G.gr,M.g,s*68,-.03,0,-Math.PI/2),mk(G.bar,M.bar,s*8.6,.3,0),mk(G.neon,s<0?M.cy:M.mg,s*8.6,.64,0),mk(G.gl,s<0?M.glC:M.glM,s*8.6,.66,0,-Math.PI/2));
  for(let k=0;k<2;k++){const z=-25+k*50+rnd(-4,4);g.add(mk(G.pole,M.pole,s*9.6,3.5,z),mk(G.arm,M.pole,s*9.05,7,z),mk(G.lamp,M.lamp,s*8.4,6.95,z))}
  for(let k=0;k<5;k++){const x=s*rnd(11,17),z=rnd(-48,48),t=new THREE.Group();t.add(mk(G.trunk,M.trunk,0,.8,0),mk(G.f1,M.f1,0,2.1,0),mk(G.f2,M.f2,0,3.1,0));t.position.set(x,0,z);t.scale.setScalar(rnd(.8,1.3));g.add(t)}
  for(let k=0;k<7;k++){const b=BL[k%4],m=new THREE.Mesh(b.g,b.m);const sx=rnd(.8,1.25);m.scale.set(sx,1,rnd(.8,1.25));m.position.set(s*rnd(26,56),b.g.parameters.height/2,-48+k*14+rnd(-3,3));g.add(m)}}
 g.position.z=TILE-i*TILE;scene.add(g);tiles.push(g)}
/* finish gantry */
const chk=ctex(256,64,(g,w,h)=>{for(let x=0;x<16;x++)for(let y=0;y<4;y++){g.fillStyle=(x+y)%2?'#fff':'#111';g.fillRect(x*16,y*16,16,16)}});
const fin=new THREE.Group();fin.add(mk(new THREE.PlaneGeometry(16,3),new THREE.MeshBasicMaterial({map:chk}),0,.03,0,-Math.PI/2));
[-9,9].forEach(x=>fin.add(mk(new THREE.BoxGeometry(.7,9,.7),M.pole,x,4.5,0)));fin.add(mk(new THREE.BoxGeometry(19,2,.6),new THREE.MeshBasicMaterial({map:rep(chk,1,.6),toneMapped:false}),0,9,0));fin.position.z=-L;scene.add(fin);
/* ---------- cars ---------- */
const glass=new THREE.MeshPhysicalMaterial({color:0x0b1118,metalness:.2,roughness:.03,transparent:true,opacity:.75,envMapIntensity:2.2});
const tireM=new THREE.MeshStandardMaterial({color:0x0c0c10,roughness:.9}),rimM=new THREE.MeshStandardMaterial({color:0xd6dae4,metalness:1,roughness:.18});
